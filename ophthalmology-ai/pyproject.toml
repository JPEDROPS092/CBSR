[project]
name = "ophthalmology-ai"
version = "0.1.0"
description = "Modular ophthalmology AI platform: orchestrates multiple DL models over fundus and OCT exams."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "Jinja2>=3.1",
    "numpy>=1.26",
    "Pillow>=10.3",
    "opencv-python-headless>=4.9",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Deep-learning runtime. Kept optional so the API, the classical/heuristic
# models and the whole test suite run on a machine without torch installed.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "monai>=1.3",
    "albumentations>=1.4",
    "scikit-learn>=1.4",
    "onnxruntime>=1.17",
]
gpu = [
    "onnxruntime-gpu>=1.17",
]
reports = [
    "reportlab>=4.1",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic.

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
